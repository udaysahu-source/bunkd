<svg viewBox="0 0 192 192" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#A855F7;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="192" height="192" fill="#09090b" rx="48"/>
  
  <!-- Gradient Circle -->
  <circle cx="96" cy="96" r="80" fill="url(#grad)" opacity="0.1"/>
  
  <!-- Main Icon: Stylized 'B' with brush stroke effect -->
  <g transform="translate(96, 96)">
    <!-- Outer circle for contrast -->
    <circle cx="0" cy="0" r="60" fill="none" stroke="url(#grad)" stroke-width="2" opacity="0.3"/>
    
    <!-- Main 'B' letter -->
    <text x="0" y="24" font-family="Arial, sans-serif" font-size="80" font-weight="bold" fill="url(#grad)" text-anchor="middle" font-style="italic">B</text>
    
    <!-- Accent marks (lightning/check marks) -->
    <path d="M 35 -15 L 45 -25 L 38 -5" stroke="url(#grad)" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 45 -8 L 55 -20 L 48 0" stroke="url(#grad)" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
    <path d="M 52 0 L 62 -10 L 55 10" stroke="url(#grad)" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>
  </g>
</svg>